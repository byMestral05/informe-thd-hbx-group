<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Helvetica, Arial, sans-serif">
  <rect width="900" height="470" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2937">Cómo conecta HBX Group el entorno IT con el entorno OT del hotel</text>

  <!-- Columna clientes -->
  <rect x="20" y="60" width="180" height="300" rx="10" fill="#eef2ff" stroke="#4f46e5"/>
  <text x="110" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#3730a3">Demanda (clientes B2B)</text>
  <text x="110" y="120" text-anchor="middle" font-size="12" fill="#1f2937">Agencias de viaje</text>
  <text x="110" y="145" text-anchor="middle" font-size="12" fill="#1f2937">Touroperadores</text>
  <text x="110" y="170" text-anchor="middle" font-size="12" fill="#1f2937">Aerolíneas</text>
  <text x="110" y="195" text-anchor="middle" font-size="12" fill="#1f2937">Programas de fidelización</text>
  <text x="110" y="220" text-anchor="middle" font-size="12" fill="#1f2937">OTAs / webs de viaje</text>
  <text x="110" y="300" text-anchor="middle" font-size="11" fill="#6b7280">Se conectan vía</text>
  <text x="110" y="316" text-anchor="middle" font-size="11" fill="#6b7280">API APItude o</text>
  <text x="110" y="332" text-anchor="middle" font-size="11" fill="#6b7280">web Bedsonline</text>

  <!-- Columna IT -->
  <rect x="250" y="60" width="300" height="300" rx="10" fill="#ecfeff" stroke="#0891b2"/>
  <text x="400" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#155e75">Entorno IT — plataforma HBX</text>
  <rect x="270" y="100" width="260" height="55" rx="6" fill="#ffffff" stroke="#0891b2"/>
  <text x="400" y="122" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2937">Cloud híbrida (AWS + Google Cloud)</text>
  <text x="400" y="140" text-anchor="middle" font-size="11" fill="#374151">Microservicios en Kubernetes (Rancher)</text>
  <rect x="270" y="165" width="260" height="55" rx="6" fill="#ffffff" stroke="#0891b2"/>
  <text x="400" y="187" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2937">Big Data</text>
  <text x="400" y="205" text-anchor="middle" font-size="11" fill="#374151">Cientos de millones de búsquedas/día</text>
  <rect x="270" y="230" width="260" height="55" rx="6" fill="#ffffff" stroke="#0891b2"/>
  <text x="400" y="252" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2937">Inteligencia artificial</text>
  <text x="400" y="270" text-anchor="middle" font-size="11" fill="#374151">Atención al cliente, previsión, recomendación</text>
  <text x="400" y="310" text-anchor="middle" font-size="11" fill="#374151">Productos hoteleros: Roiback (motor de</text>
  <text x="400" y="326" text-anchor="middle" font-size="11" fill="#374151">reservas) y Civitfun (check-in online)</text>

  <!-- Columna OT -->
  <rect x="600" y="60" width="280" height="300" rx="10" fill="#fff7ed" stroke="#ea580c"/>
  <text x="740" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#9a3412">Entorno OT — operación del hotel</text>
  <text x="740" y="120" text-anchor="middle" font-size="12" fill="#1f2937">PMS (sistema de gestión hotelera)</text>
  <text x="740" y="145" text-anchor="middle" font-size="12" fill="#1f2937">Cerraduras electrónicas / llaves</text>
  <text x="740" y="170" text-anchor="middle" font-size="12" fill="#1f2937">Recepción: tablets y kioscos</text>
  <text x="740" y="195" text-anchor="middle" font-size="12" fill="#1f2937">TPV y pasarelas de pago</text>
  <text x="740" y="220" text-anchor="middle" font-size="12" fill="#1f2937">Inventario real de habitaciones</text>
  <text x="740" y="300" text-anchor="middle" font-size="11" fill="#6b7280">Hub Civitfun: +100 integraciones</text>
  <text x="740" y="316" text-anchor="middle" font-size="11" fill="#6b7280">con PMS, pasarelas de pago</text>
  <text x="740" y="332" text-anchor="middle" font-size="11" fill="#6b7280">y cerraduras electrónicas</text>

  <!-- Flechas -->
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
  </defs>
  <line x1="203" y1="200" x2="245" y2="200" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
  <line x1="247" y1="215" x2="205" y2="215" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
  <line x1="553" y1="200" x2="595" y2="200" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
  <line x1="597" y1="215" x2="557" y2="215" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
  <text x="575" y="190" text-anchor="middle" font-size="10" fill="#374151">APIs</text>

  <!-- Banda ciberseguridad -->
  <rect x="20" y="380" width="860" height="45" rx="8" fill="#fef2f2" stroke="#dc2626"/>
  <text x="450" y="400" text-anchor="middle" font-size="13" font-weight="bold" fill="#991b1b">Ciberseguridad transversal</text>
  <text x="450" y="417" text-anchor="middle" font-size="11" fill="#374151">PCI DSS en pagos · tarjetas virtuales · cifrado · auditoría de riesgo para hoteles (Cybersential)</text>
  <text x="450" y="455" text-anchor="middle" font-size="10" fill="#6b7280">Elaboración propia a partir de las fuentes [1]–[25] del informe.</text>
</svg>
